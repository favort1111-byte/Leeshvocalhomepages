<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>관리자 | 이송희보컬레슨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="sys adm">

<main class="adm__main">
  <header class="adm__head">
    <h1>이송희보컬레슨 관리자</h1>
    <p id="adminWho" class="sys-note" hidden></p>
  </header>

  <p id="adminOff" class="sys-card" hidden>
    데이터베이스가 아직 연결되지 않았습니다. <code>js/config.js</code>에 Supabase 주소와 공개 키를 넣어주세요.
  </p>

  <form id="loginForm" class="sys-card adm__login" hidden>
    <h2 class="sys-h">로그인</h2>
    <label class="sys-field"><span>이메일</span><input name="email" type="email" autocomplete="username" required></label>
    <label class="sys-field"><span>비밀번호</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="sys-btn sys-btn--block" type="submit">로그인</button>
    <p class="sys-msg" id="loginMsg" role="status"></p>
  </form>

  <div id="app" hidden>
    <nav class="adm__tabs" role="tablist">
      <button type="button" role="tab" data-tab="bookings" aria-selected="true">예약 현황</button>
      <button type="button" role="tab" data-tab="members" aria-selected="false">수강 ID</button>
      <button type="button" role="tab" data-tab="consults" aria-selected="false">상담 신청</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false">설정</button>
      <button type="button" class="sys-link adm__logout" id="logout">로그아웃</button>
    </nav>

    <!-- 예약 현황 -->
    <section class="sys-card" data-panel="bookings">
      <div class="adm__bar">
        <button type="button" class="sys-chip" id="dayPrev" aria-label="전날">‹</button>
        <input type="date" id="dayPick" aria-label="날짜">
        <button type="button" class="sys-chip" id="dayNext" aria-label="다음날">›</button>
        <button type="button" class="sys-chip" id="dayToday">오늘</button>
      </div>
      <p class="sys-note">빈칸을 누르면 시간을 막거나 수강생 대신 예약할 수 있고, 예약을 누르면 취소할 수 있어요.</p>
      <div class="adm__gridwrap"><table class="adm__grid" id="grid"></table></div>

      <form id="slotForm" class="adm__drawer" hidden>
        <h3 class="sys-h" id="slotTitle"></h3>
        <div id="slotNew">
          <div class="sys-row">
            <label class="sys-field"><span>수강 ID (비우면 '학원 사용'으로 막기)</span><input name="member" autocapitalize="characters" spellcheck="false"></label>
            <label class="sys-field"><span>시간</span><select name="hours"></select></label>
          </div>
          <label class="sys-field"><span>메모</span><input name="memo" maxlength="100" placeholder="예) 청소, 레슨, 대관"></label>
          <button class="sys-btn" type="submit">저장</button>
        </div>
        <div id="slotExisting">
          <p id="slotInfo"></p>
          <button class="sys-btn" type="button" id="slotCancel">이 예약 취소</button>
        </div>
        <button class="sys-link" type="button" id="slotClose">닫기</button>
        <p class="sys-msg" id="slotMsg" role="status"></p>
      </form>
    </section>

    <!-- 수강 ID -->
    <section class="sys-card" data-panel="members" hidden>
      <div class="adm__bar">
        <input type="search" id="memberSearch" placeholder="이름·ID·번호 검색" aria-label="검색">
        <select id="memberFilter" aria-label="상태">
          <option value="">전체</option><option>재원</option><option>외부</option><option>휴원</option><option>종료</option>
        </select>
        <button type="button" class="sys-btn" id="memberAdd">새 수강 ID</button>
      </div>

      <form id="memberForm" class="adm__drawer" hidden>
        <h3 class="sys-h" id="memberTitle">새 수강 ID</h3>
        <div class="sys-row">
          <label class="sys-field"><span>수강 ID (영문·숫자)</span><input name="id" required autocapitalize="characters" spellcheck="false" maxlength="20"></label>
          <label class="sys-field"><span>이름</span><input name="name" required maxlength="30"></label>
        </div>
        <div class="sys-row">
          <label class="sys-field"><span>전화번호</span><input name="phone" type="tel" maxlength="20"></label>
          <label class="sys-field"><span>상태</span>
            <select name="status"><option>재원</option><option>외부</option><option>휴원</option><option>종료</option></select>
          </label>
        </div>
        <div class="sys-row">
          <label class="sys-field"><span>사용 기한 (외부 손님용, 비우면 무기한)</span><input name="expires" type="date"></label>
          <label class="sys-field"><span id="pinLabel">비밀번호 4자리</span><input name="pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}"></label>
        </div>
        <label class="sys-field"><span>메모</span><input name="memo" maxlength="200"></label>
        <div class="adm__actions">
          <button class="sys-btn" type="submit">저장</button>
          <button class="sys-link" type="button" id="memberClose">닫기</button>
        </div>
        <p class="sys-msg" id="memberMsg" role="status"></p>
      </form>

      <div class="adm__tablewrap"><table class="adm__table" id="memberTable"></table></div>
    </section>

    <!-- 상담 신청 -->
    <section class="sys-card" data-panel="consults" hidden>
      <div class="adm__bar">
        <select id="consultFilter" aria-label="상태">
          <option value="">전체</option><option selected>접수</option><option>연락완료</option><option>등록</option><option>보류</option><option>취소</option>
        </select>
      </div>
      <ul class="adm__cards" id="consultList"></ul>
    </section>

    <!-- 설정 -->
    <section class="sys-card" data-panel="settings" hidden>
      <h3 class="sys-h">연습실</h3>
      <div class="adm__tablewrap"><table class="adm__table" id="roomTable"></table></div>
      <button type="button" class="sys-link" id="roomAdd">+ 방 추가</button>
      <p class="sys-msg" id="roomMsg" role="status"></p>

      <h3 class="sys-h">예약 규칙</h3>
      <form id="rulesForm">
        <div class="sys-row">
          <label class="sys-field"><span>여는 시각 (시)</span><input name="open" type="number" min="0" max="23" required></label>
          <label class="sys-field"><span>닫는 시각 (시, 24 = 자정)</span><input name="close" type="number" min="1" max="24" required></label>
        </div>
        <div class="sys-row">
          <label class="sys-field"><span>시작 시간 단위</span><select name="unit"><option value="60">1시간</option><option value="30">30분</option></select></label>
          <label class="sys-field"><span>한 번에 최대 (시간)</span><input name="max" type="number" min="1" max="12" required></label>
        </div>
        <div class="sys-row">
          <label class="sys-field"><span>한 사람 하루 최대 (시간)</span><input name="daily" type="number" min="1" max="24" step="0.5" required></label>
          <label class="sys-field"><span>며칠 뒤까지 예약 가능</span><input name="days" type="number" min="0" max="60" required></label>
        </div>
        <label class="sys-field"><span>학생 직접 취소 마감 (시작 몇 분 전까지)</span><input name="cancel" type="number" min="0" max="1440" required></label>
        <button class="sys-btn" type="submit">규칙 저장</button>
        <p class="sys-msg" id="rulesMsg" role="status"></p>
      </form>
    </section>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
