<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>학생 홈 내 폴더</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;display=swap">
<style>
@font-face{font-family:"Gmarket";src:url("/_blob/6522c92bd8ed6da3f51f31c70881fefb") format("woff");font-weight:400 700;font-display:swap}
body{margin:0}
a{color:#2A2A2A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 1700px; overflow: hidden; background: {{lemon}}; color: {{ink}}; font-family: Gmarket, 'Noto Sans KR', sans-serif">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 18px">
    <a href="Main.dc.html" style="text-decoration: none; font-family: Anton, sans-serif; font-size: 24px">LEESH VOCAL</a>
    <button type="button" style="font-family: inherit; font-size: 13px; padding: 11px 14px; border-radius: 999px; border: 1.5px solid {{ink}}; background: transparent; color: {{ink}}">로그아웃</button>
  </header>

  <section style="padding: 18px 22px 26px">
    <div style="display: flex; align-items: flex-start; gap: 8px">
      <h1 style="margin: 0; font-family: Anton, sans-serif; font-weight: 400; font-size: 76px; line-height: .88">MY<br>FOLDER</h1>
      <span style="margin-top: 8px; display: flex; gap: 3px" aria-hidden="true"><span style="width: 10px; height: 10px; background: {{ink}}"></span><span style="width: 9px; height: 9px; border: 1px solid {{ink}}"></span></span>
    </div>
    <p style="margin: 14px 0 0; font-size: 16px">김시우님, 반가워요</p>
  </section>

  <!-- 오늘 나한테 해당하는 것 -->
  <section style="margin: 0 18px; background: {{ink}}; color: #FFFFFF; border-radius: 20px; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-family: Anton, sans-serif; font-size: 22px; color: {{lemon}}">TODAY</p>
    <sc-for list="{{today}}" as="t" hint-placeholder-count="3">
      <a href="#groups" style="text-decoration: none; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #3A3A3A; font-size: 14px">
        <span style="flex: 1">{{t.text}}</span>
        <span style="color: {{lemon}}; font-size: 13px">{{t.go}}</span>
      </a>
    </sc-for>
  </section>

  <!-- 큰 버튼 4개 -->
  <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 18px 18px 8px">
    <sc-for list="{{big}}" as="b" hint-placeholder-count="4">
      <a href="#groups" style="text-decoration: none; background: #FFFFFF; border-radius: 18px; padding: 18px 16px; min-height: 92px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
        <span style="font-family: Anton, sans-serif; font-size: 13px; letter-spacing: 1px; color: #555555">{{b.en}}</span>
        <span style="font-size: 17px; font-weight: 700">{{b.ko}}</span>
      </a>
    </sc-for>
  </section>

  <!-- 4묶음 목록 -->
  <section id="groups" style="padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 26px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div>
        <p style="margin: 0 0 8px; font-family: Anton, sans-serif; font-size: 30px; line-height: 1">{{g.en}} <span style="font-family: Gmarket, sans-serif; font-size: 14px">{{g.ko}}</span></p>
        <div style="border-top: 1px solid {{ink}}">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <a href="#groups" style="text-decoration: none; display: flex; gap: 18px; align-items: baseline; padding: 13px 4px; border-bottom: 1px solid {{ink}}; font-size: 15px">
              <span style="font-family: Anton, sans-serif; width: 26px">{{it.no}}</span>
              <span style="flex: 1">{{it.name}}</span>
              <span style="font-size: 12px">{{it.note}}</span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <p style="margin: 0; font-size: 12px; line-height: 1.6">메뉴 묶음은 제안입니다 · 지금 내 폴더 탭 13개를 4묶음으로 나눠 본 모양입니다</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ink":{"editor":"color","default":"#2A2A2A","options":["#2A2A2A","#1D4948","#111111"]},"lemon":{"editor":"color","default":"#F3F07A","options":["#F3F07A","#F2E14C","#E8F06A"]},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    var today = [
      { text: '오늘 오후 7시 · B1 연습실 예약', go: '내 예약 →' },
      { text: '새 메시지 1개', go: '보기 →' },
      { text: '이번 달 내방 오디션 신청 중', go: '신청 →' }
    ];
    var big = [
      { en: 'LESSON NOTE', ko: '레슨 노트' },
      { en: 'PRACTICE ROOM', ko: '연습실 예약' },
      { en: 'AUDITION', ko: '오디션 신청' },
      { en: 'MESSAGE', ko: '메시지' }
    ];
    function list(names) {
      return names.map(function (x, i) { return { no: '0' + (i + 1), name: x[0], note: x[1] || '' }; });
    }
    var groups = [
      { en: 'LESSON', ko: '수업', items: list([['레슨 노트'], ['곡·자료 · 가사지'], ['월말평가'], ['원장님 컨설팅', '심화반']]) },
      { en: 'PRACTICE', ko: '연습', items: list([['연습실 예약 · 내 예약'], ['연습 일지'], ['레퍼토리'], ['보컬 오락실']]) },
      { en: 'AUDITION', ko: '오디션', items: list([['일정 · 내방 오디션 신청'], ['오디션 후기'], ['합격자 인터뷰']]) },
      { en: 'ACADEMY', ko: '학원', items: list([['공지 · 학원 규정'], ['메시지'], ['제휴 업체'], ['건의함', '익명']]) }
    ];
    return { ink: this.props.ink ?? '#2A2A2A', lemon: this.props.lemon ?? '#F3F07A', today: today, big: big, groups: groups };
  }
}
</script>
</body>
</html>
